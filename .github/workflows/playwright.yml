name: Playwright Tests
run-name: "Playwright · run ${{ github.run_number }} · ${{ github.sha }} ${{ inputs.label }}"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      label:
        description: "Optional label shown in the run name (e.g. certification 1/5)"
        required: false
        default: ""

permissions:
  contents: write # push the report history to the gh-pages branch
  pages: write # deploy the report site to GitHub Pages from this workflow
  id-token: write # required by actions/deploy-pages

# Qualifying runs must never be cancelled by a later push: queue them instead.
concurrency:
  group: playwright-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Shows the public report of this run as the deployment link on the Playwright run page.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}runs/${{ github.run_number }}/
    env:
      CI: "true"
      STONEWAKE_APP_URL: ${{ vars.STONEWAKE_APP_URL || 'https://app.stonewake.ai' }}
      STONEWAKE_API_URL: ${{ vars.STONEWAKE_API_URL || 'https://api.stonewake.ai' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Credentials are scoped to the two steps that need them; the publish step never sees them.
      - name: Run Playwright tests (zero retries)
        id: tests
        env:
          STONEWAKE_EMAIL: ${{ secrets.STONEWAKE_EMAIL }}
          STONEWAKE_PASSWORD: ${{ secrets.STONEWAKE_PASSWORD }}
          STONEWAKE_API_KEY: ${{ secrets.STONEWAKE_API_KEY }}
        run: npx playwright test

      - name: Fail if the HTML report contains credentials
        if: ${{ !cancelled() }}
        env:
          STONEWAKE_PASSWORD: ${{ secrets.STONEWAKE_PASSWORD }}
          STONEWAKE_API_KEY: ${{ secrets.STONEWAKE_API_KEY }}
        run: |
          for secret in "$STONEWAKE_API_KEY" "$STONEWAKE_PASSWORD" "swk_live_"; do
            if [ -n "$secret" ] && grep -rqF -- "$secret" playwright-report; then
              echo "::error::playwright-report contains a credential; refusing to publish"
              exit 1
            fi
          done

      - name: Upload HTML report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-run-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30

      - name: Build the public report site (this run + history)
        if: ${{ !cancelled() }}
        env:
          RUN_CONCLUSION: ${{ steps.tests.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git clone --depth 1 --branch gh-pages "https://github.com/${{ github.repository }}.git" site 2>/dev/null || mkdir -p site
          node scripts/ci/build-report-site.mjs site

      - name: Publish report to GitHub Pages (gh-pages branch)
        if: ${{ !cancelled() }}
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          keep_files: false
          force_orphan: true
          commit_message: "report: run ${{ github.run_number }} (${{ github.sha }})"

      # Deploy the same site from this workflow, so the Pages link belongs to the Playwright run
      # (no separate "pages build and deployment" workflow). gh-pages remains the history store.
      - name: Upload the report site for GitHub Pages
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy the report site to GitHub Pages
        id: deployment
        if: ${{ !cancelled() }}
        uses: actions/deploy-pages@v4

      # Puts the public report links on the run page, so a reader can go from the run to its report.
      - name: Link the public report in the run summary
        if: ${{ !cancelled() }}
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          RUN_CONCLUSION: ${{ steps.tests.outcome }}
        run: |
          {
            echo "## Playwright run ${{ github.run_number }}: ${RUN_CONCLUSION}"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Report for this run (GitHub Pages): ${PAGES_URL}/runs/${{ github.run_number }}/"
            echo "- All runs: ${PAGES_URL}/"
            echo "- HTML report artifact: \`playwright-report-run-${{ github.run_number }}\` (below)"
            echo ""
            echo "GitHub Pages can take a minute or two to serve a new run after this job ends."
          } >> "$GITHUB_STEP_SUMMARY"
